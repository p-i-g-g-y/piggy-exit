<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f0b1e">
<title>Piggy exit</title>
<script type="module" src="/src/main.ts"></script>
</head>
<body>
<main class="page">
  <header class="head">
    <p id="eyebrow" class="eyebrow"></p>
    <h1 id="title"></h1>
    <p id="lead" class="lead"></p>
    <noscript><p class="problem">This page needs JavaScript to open your file.</p></noscript>
  </header>

  <section id="pick" class="card">
    <button id="choose" class="primary" type="button"></button>
    <input id="file" type="file" accept=".json,application/json" hidden>
    <p id="where" class="note"></p>
    <p id="pick-problem" class="problem" role="alert" hidden></p>
  </section>

  <section id="opened" class="card" hidden>
    <p id="summary-amount" class="amount"></p>
    <p id="summary-date" class="note"></p>
    <form id="unlock" hidden novalidate>
      <div id="who-row" class="field" hidden>
        <label id="who-label" for="who"></label>
        <input id="who" name="username" autocomplete="username" readonly>
      </div>
      <div class="field">
        <label id="password-label" for="password"></label>
        <input id="password" name="password" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false">
      </div>
      <button id="open" class="primary" type="submit"></button>
    </form>
    <form id="words" hidden novalidate>
      <p id="words-note" class="note"></p>
      <div class="field">
        <label id="phrase-label" for="phrase"></label>
        <textarea id="phrase" rows="3" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"></textarea>
      </div>
      <button id="check" class="primary" type="submit"></button>
    </form>
    <p id="status" class="note status" aria-live="polite"></p>
    <p id="problem" class="problem" role="alert" hidden></p>
  </section>

  <section id="app" class="card" hidden>
    <h2 id="app-title" tabindex="-1"></h2>
    <p id="app-body"></p>
    <a id="app-get" class="button primary" href="https://pig.gy/download" rel="noopener noreferrer"></a>
    <button id="app-cant" class="secondary" type="button"></button>
  </section>

  <section id="spark" class="card" hidden>
    <h2 id="spark-title" tabindex="-1"></h2>
    <p id="spark-ready"></p>
    <p id="spark-incoming" class="note" hidden></p>
    <p id="spark-kill" hidden></p>
    <form id="address-form" novalidate>
      <div class="field">
        <label id="address-label" for="address"></label>
        <input id="address" name="address" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
        <p id="address-hint" class="note"></p>
      </div>
      <button id="get-fee" class="primary" type="submit"></button>
    </form>
    <div id="quote" hidden>
      <p id="quote-line" class="summary"></p>
      <button id="send" class="primary" type="button"></button>
      <button id="other-address" class="secondary" type="button"></button>
    </div>
    <p id="spark-status" class="note status" aria-live="polite"></p>
    <p id="spark-problem" class="problem" role="alert" hidden></p>
  </section>

  <section id="sent" class="card" hidden>
    <h2 id="sent-title" tabindex="-1"></h2>
    <p id="sent-body"></p>
    <p id="sent-watch" class="note"></p>
    <ul id="sent-list" class="txids"></ul>
  </section>

  <section id="bitcoin" class="card" hidden>
    <h2 id="bitcoin-title" tabindex="-1"></h2>
    <p id="bitcoin-body"></p>
    <p id="slow-back" class="summary" hidden></p>
    <p id="slow-stranded" class="note" hidden></p>
    <p id="slow-kill" hidden></p>
    <div id="slow-fund" hidden>
      <p id="slow-fund-line"></p>
      <p id="slow-fee-address" class="address"></p>
      <button id="slow-copy" class="secondary" type="button"></button>
      <a id="slow-open-wallet" class="button secondary" rel="noopener noreferrer"></a>
    </div>
    <div id="slow-wait" hidden>
      <p id="slow-wait-line"></p>
      <a id="slow-calendar" class="button secondary" download="take-your-bitcoin-back.ics"></a>
    </div>
    <form id="slow-sweep" hidden novalidate>
      <p id="slow-ready" class="summary"></p>
      <div class="field">
        <label id="slow-address-label" for="slow-address"></label>
        <input id="slow-address" name="slow-address" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
        <p id="slow-address-hint" class="note"></p>
      </div>
      <button id="slow-get-fee" class="primary" type="submit"></button>
    </form>
    <div id="slow-quote" hidden>
      <p id="slow-quote-line" class="summary"></p>
      <button id="slow-send" class="primary" type="button"></button>
      <button id="slow-other" class="secondary" type="button"></button>
    </div>
    <p id="slow-status" class="note status" aria-live="polite"></p>
    <p id="slow-note" class="note" hidden></p>
    <p id="slow-problem" class="problem" role="alert" hidden></p>
    <button id="ask-again" class="secondary" type="button"></button>
  </section>

  <button id="start-over" class="secondary" type="button" hidden></button>

  <footer class="foot">
    <p id="tagline" class="tagline"></p>
    <p class="version"><span id="version"></span> · <a id="source" href="https://github.com/p-i-g-g-y/piggy-exit" rel="noopener noreferrer"></a></p>
  </footer>
</main>
</body>
</html>
